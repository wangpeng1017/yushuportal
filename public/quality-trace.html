<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>质量追溯系统 Demo</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    :root {
      --primary: #1677ff;
      --success: #52c41a;
      --warning: #faad14;
      --danger: #ff4d4f;
      --info: #13c2c2;
      --bg-body: #f0f2f5;
      --bg-card: #fff;
      --border-color: #e8e8e8;
      --text-primary: #262626;
      --text-secondary: #595959;
      --text-muted: #8c8c8c;
      --sidebar-bg: #001529;
      --sidebar-active: #1890ff;
      --transition: all 0.2s ease;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg-body); color: var(--text-primary); line-height: 1.5; }
    
    /* Sidebar Navigation */
    .sidebar { width: 200px; background: var(--sidebar-bg); position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-header h2 { color: #fff; font-size: 16px; font-weight: 600; }
    .sidebar-menu { list-style: none; padding: 8px 0; }
    .sidebar-menu li { margin: 2px 0; }
    .sidebar-menu a { display: flex; align-items: center; gap: 8px; padding: 10px 16px; color: rgba(255,255,255,0.65); text-decoration: none; font-size: 14px; transition: var(--transition); }
    .sidebar-menu a:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .sidebar-menu a.active { color: #fff; background: var(--sidebar-active); }
    .sidebar-menu a i { font-size: 16px; width: 20px; text-align: center; }
    
    /* Main Content */
    .main-content { margin-left: 200px; padding: 16px 24px; min-height: 100vh; }
    
    /* Top Header */
    .top-header { background: var(--bg-card); border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: space-between; }
    .top-header h1 { font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .top-header h1 i { color: var(--primary); margin-right: 8px; }
    .header-actions { display: flex; gap: 8px; }
    .header-actions button { font-size: 12px; padding: 6px 12px; border: 1px solid var(--border-color); background: var(--bg-card); border-radius: 4px; cursor: pointer; color: var(--text-secondary); transition: var(--transition); }
    .header-actions button:hover { border-color: var(--primary); color: var(--primary); }
    
    /* Stats Cards */
    .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 16px; }
    .stat-card { background: var(--bg-card); border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .stat-card .stat-value { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .stat-card .stat-label { font-size: 12px; color: var(--text-muted); }
    .stat-card.primary .stat-value { color: var(--primary); }
    .stat-card.success .stat-value { color: var(--success); }
    .stat-card.warning .stat-value { color: var(--warning); }
    .stat-card.danger .stat-value { color: var(--danger); }
    .stat-card.info .stat-value { color: var(--info); }
    
    /* Layout */
    .main-layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; min-height: calc(100vh - 180px); }
    
    /* Impact Analysis */
    .impact-analysis { background: var(--bg-card); border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .impact-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .impact-title i { color: var(--warning); }
    .impact-info { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
    .impact-info strong { color: var(--primary); margin: 0 4px; }
    .impact-stats { display: flex; gap: 16px; flex-wrap: wrap; }
    .impact-stat-item { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #f5f7fa; border-radius: 6px; }
    .impact-stat-item .stat-num { font-size: 18px; font-weight: 700; }
    .impact-stat-item .stat-text { font-size: 12px; color: var(--text-muted); }
    .impact-stat-item.shipped .stat-num { color: var(--info); }
    .impact-stat-item.instock .stat-num { color: var(--success); }
    .impact-stat-item.inprod .stat-num { color: var(--warning); }
    .impact-stat-item.abnormal .stat-num { color: var(--danger); }
    .impact-alert { margin-top: 12px; padding: 8px 12px; background: #fff2f0; border: 1px solid #ffccc7; border-radius: 6px; font-size: 12px; color: var(--danger); display: flex; align-items: center; gap: 6px; }
    .impact-alert i { font-size: 14px; }
    
    /* Trace Mode Selector */
    .trace-mode-selector { background: var(--bg-card); border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .trace-mode-tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 2px solid var(--border-color); }
    .trace-mode-tab { padding: 8px 20px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: var(--transition); }
    .trace-mode-tab:hover { color: var(--primary); }
    .trace-mode-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .trace-input-row { display: flex; gap: 12px; align-items: center; }
    .trace-input-row label { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
    .trace-input-row input { flex: 1; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; }
    .trace-input-row input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
    .trace-input-row button { padding: 8px 20px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; transition: var(--transition); }
    .trace-input-row button:hover { background: #0958d9; }
    .trace-mode-content { display: none; }
    .trace-mode-content.active { display: block; }
    .trace-hint { margin-top: 8px; padding: 8px 12px; background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 6px; font-size: 12px; color: #0050b3; }
    
    /* Demo Buttons */
    .demo-buttons { margin-top: 10px; padding: 10px 12px; background: #f5f7fa; border-radius: 6px; }
    .demo-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
    .demo-btn-row { display: flex; gap: 8px; }
    .demo-btn { flex: 1; padding: 8px 12px; background: #fff; border: 1px solid var(--border-color); border-radius: 4px; font-size: 12px; color: var(--text-primary); cursor: pointer; text-align: left; transition: var(--transition); }
    .demo-btn:hover { border-color: var(--primary); color: var(--primary); background: #f0f7ff; }
    .demo-btn::before { content: "▶ "; color: var(--primary); font-size: 10px; }
    
    /* Batch Tabs */
    .batch-tab { padding: 8px 20px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: var(--transition); }
    .batch-tab:hover { color: var(--primary); }
    .batch-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .batch-checkbox { cursor: pointer; }
    
    /* Product Tabs */
    .product-tab { padding: 8px 20px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: var(--transition); }
    .product-tab:hover { color: var(--primary); }
    .product-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    
    /* Tree Panel */
    .tree-panel { background: var(--bg-card); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); overflow: hidden; }
    .tree-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .tree-header h3 { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .tree-header h3 i { color: var(--primary); margin-right: 6px; }
    .tree-actions { display: flex; gap: 8px; }
    .tree-actions button { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border-color); background: var(--bg-card); border-radius: 4px; cursor: pointer; color: var(--text-secondary); transition: var(--transition); }
    .tree-actions button:hover { border-color: var(--primary); color: var(--primary); }
    
    .tree-content { padding: 12px; overflow-y: auto; max-height: calc(100vh - 200px); }
    
    /* Tree Nodes */
    .tree-node { user-select: none; }
    .tree-node-row { display: flex; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; transition: var(--transition); }
    .tree-node-row:hover { background: #f0f5ff; }
    .tree-node-row.active { background: #e6f4ff; }
    .tree-toggle { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; transition: var(--transition); flex-shrink: 0; }
    .tree-toggle.expanded { transform: rotate(90deg); }
    .tree-toggle.hidden { visibility: hidden; }
    .tree-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; margin: 0 6px; color: var(--primary); font-size: 14px; flex-shrink: 0; }
    .tree-label { flex: 1; font-size: 13px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tree-status { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
    .tree-tag { font-size: 11px; padding: 1px 6px; border-radius: 10px; font-weight: 500; }
    .tree-tag.shipped { background: #e6f7ff; color: var(--info); }
    .tree-tag.instock { background: #f6ffed; color: var(--success); }
    .tree-tag.inprod { background: #fffbe6; color: var(--warning); }
    .tree-tag.mrb { background: #fff1f0; color: var(--danger); }
    
    .tree-children { margin-left: 20px; border-left: 1px dashed var(--border-color); padding-left: 8px; }
    .tree-children.collapsed { display: none; }
    
    /* Detail Panel */
    .detail-panel { background: var(--bg-card); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); overflow: hidden; }
    .detail-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
    .detail-header h3 { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .detail-header h3 i { color: var(--primary); margin-right: 6px; }
    
    .detail-body { padding: 16px; overflow-y: auto; max-height: calc(100vh - 160px); }
    
    /* Detail Sections */
    .detail-section { margin-bottom: 20px; }
    .section-title { font-size: 14px; font-weight: 600; color: var(--text-primary); padding-bottom: 8px; margin-bottom: 12px; border-bottom: 2px solid var(--border-color); display: flex; align-items: center; gap: 6px; }
    .section-title i { color: var(--primary); }
    
    /* Detail Grid */
    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .detail-item { display: flex; flex-direction: column; gap: 4px; }
    .detail-item .label { font-size: 12px; color: var(--text-muted); }
    .detail-item .value { font-size: 13px; color: var(--text-primary); font-weight: 500; }
    .detail-item-full { grid-column: 1 / -1; }
    
    /* Status Tags */
    .highlight-ok { color: var(--success); font-weight: 600; }
    .highlight-err { color: var(--danger); font-weight: 600; }
    
    /* Table */
    .detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .detail-table th, .detail-table td { padding: 8px 12px; border: 1px solid var(--border-color); text-align: left; }
    .detail-table th { background: #fafafa; font-weight: 600; color: var(--text-secondary); }
    .detail-table tr:hover { background: #f5f7fa; }
    
    /* Links */
    .detail-link-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--primary); text-decoration: none; cursor: pointer; padding: 4px 0; }
    .detail-link-btn:hover { text-decoration: underline; }
    .table-link { color: var(--primary); cursor: pointer; text-decoration: none; }
    .table-link:hover { text-decoration: underline; }
    
    /* Inspect Items */
    .inspect-items { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .inspect-item { font-size: 12px; padding: 4px 10px; background: #f6ffed; border-radius: 4px; color: var(--success); }
    
    /* Button */
    .btn-sm-custom { font-size: 12px; padding: 4px 12px; border-radius: 4px; cursor: pointer; transition: var(--transition); }
    .btn-sm-custom:hover { opacity: 0.85; }
    
    /* IPQC Tabs */
    .ipqc-tabs { display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 12px; }
    .ipqc-tab { padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: var(--transition); display: flex; align-items: center; gap: 4px; }
    .ipqc-tab:hover { color: var(--primary); }
    .ipqc-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-badge { background: var(--primary); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }
    .ipqc-tab-content { display: none; }
    .ipqc-tab-content.active { display: block; }
    
    /* Empty State */
    .empty-state { padding: 40px 20px; text-align: center; color: var(--text-muted); }
    .empty-state i { font-size: 48px; margin-bottom: 12px; display: block; }
    .empty-state p { font-size: 14px; }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>QMS 质量管理系统</h2>
    </div>
    <ul class="sidebar-menu">
      <li><a href="#" class="active"><i class="bi bi-diagram-3"></i>质量追溯</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="top-header">
      <h1><i class="bi bi-diagram-3"></i>质量追溯</h1>
    </div>
    
    <!-- 追溯模式选择 -->
    <div class="trace-mode-selector">
      <div class="trace-mode-tabs">
        <div class="trace-mode-tab active" onclick="switchTraceMode('forward')">正向追溯</div>
        <div class="trace-mode-tab" onclick="switchTraceMode('reverse')">逆向追溯</div>
      </div>
      
      <!-- 正向追溯输入 -->
      <div id="trace-forward" class="trace-mode-content active">
        <div class="trace-input-row">
          <label>零件号：</label>
          <input type="text" id="forward-part-no" placeholder="请输入零件号，如：SM-202604001" style="flex:1;">
          <label style="margin-left:12px;">批次号：</label>
          <input type="text" id="forward-batch-no" placeholder="请输入批次号" style="flex:1;">
          <button onclick="traceForward()" style="margin-left:12px;"><i class="bi bi-search"></i> 追溯查询</button>
        </div>
        <div class="demo-buttons">
          <div class="demo-label">同组零部件：</div>
          <div class="demo-btn-row">
            <button class="demo-btn" onclick="setForwardDemo('SM')">伺服电机 SM-202604001</button>
            <button class="demo-btn" onclick="setForwardDemo('HR')">谐波减速器 HR-202604001</button>
          </div>
        </div>
      </div>
      
      <!-- 逆向追溯输入 -->
      <div id="trace-reverse" class="trace-mode-content">
        <div class="trace-input-row">
          <label>整机S/N码：</label>
          <input type="text" id="reverse-sn" placeholder="请输入整机序列号，如：CR6-20260428-001">
          <button onclick="traceReverse()"><i class="bi bi-search"></i> 追溯查询</button>
        </div>
        <div class="demo-buttons">
          <div class="demo-label">演示数据：</div>
          <div class="demo-btn-row">
            <button class="demo-btn" onclick="setReverseDemo()">整机 CR6-20260428-001</button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 影响范围分析（初始隐藏，查询后显示） -->
    <div class="impact-analysis" id="impactAnalysis" style="display:none;">
      <div class="impact-title"><i class="bi bi-exclamation-triangle"></i> 影响范围分析</div>
      <div class="impact-info" id="impactInfo"></div>
      <div class="impact-stats" id="impactStats"></div>
      <div class="impact-alert" id="impactAlert" style="display:none;"></div>
    </div>
    
    <div class="main-layout">
      <div class="tree-panel">
        <div class="tree-header">
          <h3><i class="bi bi-diagram-3"></i>追溯树</h3>
          <div class="tree-actions">
            <button onclick="expandAll()"><i class="bi bi-arrows-expand"></i> 全部展开</button>
            <button onclick="collapseAll()"><i class="bi bi-arrows-collapse"></i> 全部收起</button>
          </div>
        </div>
        <div class="tree-content" id="treeContainer"></div>
      </div>
      
      <div class="detail-panel">
        <div class="detail-header">
          <h3><i class="bi bi-info-circle"></i>详情</h3>
        </div>
        <div class="detail-body" id="detailBody">
          <div class="empty-state">
            <i class="bi bi-arrow-left-circle"></i>
            <p>请点击左侧追溯树节点查看详情</p>
          </div>
        </div>
      </div>
    </div>
  </div>

    // Render Tree
    function renderTree(node, container, level = 0) {
      container.innerHTML = renderTreeNode(node, level);
    }
    
    function renderTreeNode(node, level) {
      const hasChildren = node.children && node.children.length > 0;
      const isExpanded = node.expanded !== false;
      
      let statusHtml = '';
      if (node.statusTag) {
        statusHtml = `<span class="tree-tag ${node.statusTag}">${node.statusTagText}</span>`;
      }
      if (node.mrbTag) {
        statusHtml += `<span class="tree-tag mrb">${node.mrbTag}</span>`;
      }
      
      return `
        <div class="tree-node" data-type="${node.type}">
          <div class="tree-node-row" data-type="${node.type}" data-idx="${node.batchIdx !== undefined ? node.batchIdx : (node.matIdx !== undefined ? node.matIdx : '')}" onclick="onTreeNodeClick(this)">
            <span class="tree-toggle ${hasChildren ? (isExpanded ? 'expanded' : '') : 'hidden'}"><i class="bi bi-chevron-right"></i></span>
            <span class="tree-icon"><i class="bi ${node.icon || 'bi-circle'}"></i></span>
            <span class="tree-label">${node.label}</span>
            <span class="tree-status">${statusHtml}</span>
          </div>
          ${hasChildren ? `<div class="tree-children ${isExpanded ? '' : 'collapsed'}">${node.children.map(c => renderTreeNode(c, level + 1)).join('')}</div>` : ''}
        </div>
      `;
    }
    
    function initTree() {
      const container = $('treeContainer');
      container.innerHTML = '';
      renderTree(d.tree, container);
    }
    
    // Tree click handler
    function onTreeNodeClick(el) {
      // Active state
      document.querySelectorAll('.tree-node-row').forEach(r => r.classList.remove('active'));
      el.classList.add('active');
      
      // Toggle children
      const parentNode = el.closest('.tree-node');
      const childrenContainer = parentNode.querySelector('.tree-children');
      const toggle = el.querySelector('.tree-toggle');
      
      if (childrenContainer) {
        const isCollapsed = childrenContainer.classList.contains('collapsed');
        childrenContainer.classList.toggle('collapsed');
        toggle.classList.toggle('expanded');
      }
      
      // Render detail
      const type = el.dataset.type;
      const idx = el.dataset.idx;
      renderDetail(type, idx);
    }
    
    // Render detail panel
    function renderDetail(type, idx) {
      const detailBody = $('detailBody');
      const node = findNodeByType(d.tree, type);
      if (!node) return;
      
      switch(type) {
        case "root": detailBody.innerHTML = ''; break;
        case "materialBaseInfo": renderMaterialBaseInfo(d); break;
        case "productBaseInfo": renderProductBaseInfo(d); break;
        case "supplier": renderSupplierDetail(d); break;
        case "iqc": renderIqcDetail(d); break;
        case "mrb": renderMrbDetail(d); break;
        case "sameBatch": renderSameBatchDetail(d); break;
        case "sameBatchProducts": renderSameBatchProducts(d); break;
        case "workorder": detailBody.innerHTML = ''; break;
        case "workorderDetail": renderWorkorderDetail(d); break;
        case "workorderReverse": detailBody.innerHTML = ''; break;
        case "ipqc": renderIpqcDetail(d); break;
        case "ipqc_reverse": renderIpqcReverseDetail(d); break;
        case "fqc": renderFqcDetail(d); break;
        case "material": renderMaterialDetailWithIqc(d, parseInt(idx)); break;
        case "product": renderProductDetail(d, parseInt(idx)); break;
        case "products": detailBody.innerHTML = ''; break;
        case "assembled-products": renderAssembledProducts(d); break;
        case "same-order-products": renderSameOrderProducts(d); break;
        default: renderDefaultDetail(node); break;
      }
    }
    
    function findNodeByType(node, type) {
      if (node.type === type) return node;
      if (node.children) {
        for (const child of node.children) {
          const found = findNodeByType(child, type);
          if (found) return found;
        }
      }
      return null;
    }

    // 切换同批次零部件Tab
    function switchBatchTab(tab, el) {
      document.querySelectorAll('.batch-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      
      const rows = document.querySelectorAll('#batch-table-body tr');
      const batchActions = document.getElementById('batch-actions');
      
      rows.forEach(row => {
        const status = row.dataset.status;
        if (tab === 'all') {
          row.style.display = '';
        } else if (tab === 'used') {
          row.style.display = status === '已使用' ? '' : 'none';
        } else if (tab === 'unused') {
          row.style.display = status === '未使用' ? '' : 'none';
        }
      });
      
      // 仅未使用Tab显示批量操作按钮和全选
      batchActions.style.display = tab === 'unused' ? 'flex' : 'none';
      const selectAll = document.getElementById('select-all-batch');
      if (selectAll) selectAll.style.display = tab === 'unused' ? '' : 'none';
    }
    
    // 全选/取消全选同批次零部件
    function toggleSelectAllBatch(checked) {
      document.querySelectorAll('.batch-checkbox:not(:disabled)').forEach(cb => {
        cb.checked = checked;
      });
      updateBatchSelectedCount();
    }
    
    // 更新已选择数量
    function updateBatchSelectedCount() {
      const checked = document.querySelectorAll('.batch-checkbox:checked').length;
      const countEl = document.getElementById('batch-selected-count');
      if (countEl) countEl.textContent = `已选择 ${checked} 个`;
    }
    
    // 批量锁定零部件
    function batchLockParts() {
      const checkedBoxes = document.querySelectorAll('.batch-checkbox:checked');
      if (checkedBoxes.length === 0) {
        alert('请选择要锁定的零部件');
        return;
      }
      
      const reason = prompt('请输入锁定原因：');
      if (!reason) return;
      
      checkedBoxes.forEach(cb => {
        const idx = parseInt(cb.dataset.idx);
        d.sameBatchParts[idx].locked = true;
        d.sameBatchParts[idx].lockReason = reason;
      });
      
      alert(`成功锁定 ${checkedBoxes.length} 个零部件`);
      renderSameBatchDetail(d);
    }
    
    // 批量解锁零部件
    function batchUnlockParts() {
      const checkedBoxes = document.querySelectorAll('.batch-checkbox:checked');
      if (checkedBoxes.length === 0) {
        alert('请选择要解锁的零部件');
        return;
      }
      
      checkedBoxes.forEach(cb => {
        const idx = parseInt(cb.dataset.idx);
        d.sameBatchParts[idx].locked = false;
        d.sameBatchParts[idx].lockReason = '';
      });
      
      alert(`成功解锁 ${checkedBoxes.length} 个零部件`);
      renderSameBatchDetail(d);
    }

    // 切换整机信息Tab
    function switchProductTab(tab, el) {
      document.querySelectorAll('.product-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      
      const rows = document.querySelectorAll('#products-table-body tr');
      const batchActions = document.getElementById('product-batch-actions');
      const selectAll = document.getElementById('select-all-products');
      
      rows.forEach(row => {
        const isShipped = row.dataset.shipped === 'true';
        if (tab === 'all') {
          row.style.display = '';
        } else if (tab === 'shipped') {
          row.style.display = isShipped ? '' : 'none';
        } else if (tab === 'unshipped') {
          row.style.display = !isShipped ? '' : 'none';
        }
      });
      
      // 仅未发货Tab显示批量操作按钮和全选
      batchActions.style.display = tab === 'unshipped' ? 'flex' : 'none';
      selectAll.style.display = tab === 'unshipped' ? '' : 'none';
    }
    
    // 全选/取消全选
    function toggleSelectAllProducts(checked, productType) {
      document.querySelectorAll(`.product-checkbox[data-type="${productType}"]:not(:disabled)`).forEach(cb => {
        cb.checked = checked;
      });
      updateSelectedCount();
    }
    
    // 更新已选择数量
    function updateSelectedCount() {
      const count = document.querySelectorAll('.product-checkbox:checked').length;
      const countEl = document.getElementById('selected-count');
      if (countEl) {
        countEl.textContent = `已选择 ${count} 台`;
      }
    }
    
    // 批量锁定
    function batchLockProducts(productType) {
      const selected = Array.from(document.querySelectorAll('.product-checkbox:checked')).map(cb => parseInt(cb.dataset.idx));
      if (selected.length === 0) {
        alert('请先选择要锁定的整机');
        return;
      }
      
      const reason = prompt(`请输入锁定原因（将锁定 ${selected.length} 台整机）：`);
      if (reason === null) return;
      if (!reason.trim()) {
        alert('锁定原因不能为空');
        return;
      }
      
      const products = productType === 'assembled' ? d.assembledProducts : d.sameOrderProducts;
      selected.forEach(idx => {
        products[idx].locked = true;
        products[idx].lockReason = reason.trim();
      });
      
      alert(`已成功锁定 ${selected.length} 台整机`);
      renderProductGroupTable(products, productType);
    }
    
    // 批量解锁
    function batchUnlockProducts(productType) {
      const selected = Array.from(document.querySelectorAll('.product-checkbox:checked')).map(cb => parseInt(cb.dataset.idx));
      if (selected.length === 0) {
        alert('请先选择要解锁的整机');
        return;
      }
      
      const products = productType === 'assembled' ? d.assembledProducts : d.sameOrderProducts;
      selected.forEach(idx => {
        products[idx].locked = false;
        products[idx].lockReason = "";
      });
      
      alert(`已成功解锁 ${selected.length} 台整机`);
      renderProductGroupTable(products, productType);
    }

    // 同批次整机Tab切换
    function switchSameBatchTab(tab, el) {
      document.querySelectorAll('.product-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      
      const rows = document.querySelectorAll('#reverse-products-table-body tr');
      const batchActions = document.getElementById('reverse-product-batch-actions');
      const selectAll = document.getElementById('select-all-reverse-products');
      
      rows.forEach(row => {
        const isShipped = row.dataset.shipped === 'true';
        if (tab === 'all') {
          row.style.display = '';
        } else if (tab === 'shipped') {
          row.style.display = isShipped ? '' : 'none';
        } else if (tab === 'instock') {
          row.style.display = !isShipped ? '' : 'none';
        }
      });
      
      batchActions.style.display = tab === 'instock' ? 'flex' : 'none';
      selectAll.style.display = tab === 'instock' ? '' : 'none';
    }
    
    // 全选/取消全选
    function toggleReverseSelectAll(checked) {
      document.querySelectorAll('.reverse-product-checkbox:not(:disabled)').forEach(cb => {
        cb.checked = checked;
      });
      updateReverseSelectedCount();
    }
    
    // 更新已选择数量
    function updateReverseSelectedCount() {
      const count = document.querySelectorAll('.reverse-product-checkbox:checked').length;
      const countEl = document.getElementById('reverse-selected-count');
      if (countEl) countEl.textContent = `已选择 ${count} 台`;
    }
    
    // 批量锁定
    function reverseBatchLock() {
      const selected = Array.from(document.querySelectorAll('.reverse-product-checkbox:checked')).map(cb => parseInt(cb.dataset.idx));
      if (selected.length === 0) { alert('请先选择要锁定的整机'); return; }
      const reason = prompt(`请输入锁定原因（将锁定 ${selected.length} 台整机）：`);
      if (!reason) return;
      selected.forEach(idx => {
        d.sameBatchProducts[idx].locked = true;
        d.sameBatchProducts[idx].lockReason = reason.trim();
      });
      alert(`已成功锁定 ${selected.length} 台整机`);
      renderSameBatchProducts(d);
    }
    
    // 批量解锁
    function reverseBatchUnlock() {
      const selected = Array.from(document.querySelectorAll('.reverse-product-checkbox:checked')).map(cb => parseInt(cb.dataset.idx));
      if (selected.length === 0) { alert('请先选择要解锁的整机'); return; }
      selected.forEach(idx => {
        d.sameBatchProducts[idx].locked = false;
        d.sameBatchProducts[idx].lockReason = '';

      alert(`已成功解锁 ${selected.length} 台整机`);
      renderSameBatchProducts(d);
    }

                    <th>工序名称</th>
                    <th>检验单号</th>
                    <th>检验人员</th>
                    <th>检验时间</th>
                    <th style="width:100px;">检验结果</th>
                    <th>MRB单号</th>
                    <th style="width:100px;">操作</th>
                  </tr>
                </thead>
                <tbody>${firstArticleRowsHtml}</tbody>
              </table>
            </div>
          </div>
          
          <!-- 过程巡检内容 -->
          <div id="ipqc-patrol" class="ipqc-tab-content">
            <div style="overflow-x:auto;">
              <table class="detail-table">
                <thead>
                  <tr>
                    <th style="width:60px;">序号</th>
                    <th>检验单号</th>
                    <th>巡检人员</th>
                    <th>巡检时段</th>
                    <th>巡检时间</th>
                    <th style="width:100px;">检验结果</th>
                    <th>MRB单号</th>
                    <th style="width:100px;">操作</th>
                  </tr>
                </thead>
                <tbody>${patrolRowsHtml}</tbody>
              </table>
            </div>
          </div>
          
          <div style="margin-top:12px;font-size:12px;color:var(--text-secondary);">
            <i class="bi bi-info-circle"></i> 
            首件检验：共 ${firstArticles.length} 条记录，其中 ${abnormalFirstCount} 条存在质量异常 | 
            过程巡检：共 ${patrolRecords.length} 次记录，其中 ${abnormalPatrolCount} 次存在质量异常
          </div>
        </div>`;
    }
    
    function renderMaterialDetail(d, idx) {
      const mat = d.materials[idx];
      detailBody.innerHTML = `
        <div class="detail-section">
          <div class="section-title">装配物料信息</div>
          <div class="detail-grid">
            <div class="detail-item"><span class="label">物料编码</span><span class="value">${mat.code}</span></div>
            <div class="detail-item"><span class="label">物料名称</span><span class="value">${mat.name}</span></div>
            <div class="detail-item"><span class="label">供应商</span><span class="value">${mat.supplier}</span></div>
            <div class="detail-item"><span class="label">批次号</span><span class="value">${mat.batchNo}</span></div>
            <div class="detail-item"><span class="label">来料日期</span><span class="value">${mat.receiptDate}</span></div>
            <div class="detail-item"><span class="label">IQC检验结果</span><span class="value" style="color:var(--success);font-weight:600;">✓ ${mat.iqcResult}</span></div>
          </div>
        </div>`;
    }
    
    function renderDefaultDetail(node) {
      detailBody.innerHTML = `
        <div class="detail-section">
          <div class="section-title">${node.label}</div>
          <div style="padding:20px;text-align:center;color:var(--text-muted);">
            <i class="bi bi-info-circle" style="font-size:24px;display:block;margin-bottom:8px;"></i>
            <p>详情内容开发中...</p>
          </div>
        </div>`;
    }
    
    // Expand/Collapse all
    function expandAll() {
      document.querySelectorAll('.tree-children').forEach(el => el.classList.remove('collapsed'));
      document.querySelectorAll('.tree-toggle:not(.hidden)').forEach(el => el.classList.add('expanded'));
    }
    
    function collapseAll() {
      document.querySelectorAll('.tree-children').forEach(el => el.classList.add('collapsed'));
      document.querySelectorAll('.tree-toggle:not(.hidden)').forEach(el => el.classList.remove('expanded'));
    }
    
    // 追溯模式切换
    function switchTraceMode(mode) {
      // 切换Tab样式
      document.querySelectorAll('.trace-mode-tab').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');
      
      // 切换内容显示
      document.querySelectorAll('.trace-mode-content').forEach(content => content.classList.remove('active'));
      document.getElementById('trace-' + mode).classList.add('active');
    }
    
    // 设置正向追溯演示数据
    function setForwardDemo(type) {
      if (type === 'SM') {
        document.getElementById('forward-part-no').value = 'SM-202604001';
        document.getElementById('forward-batch-no').value = 'SM-202604001';
      } else if (type === 'HR') {
        document.getElementById('forward-part-no').value = 'HR-202604001';
        document.getElementById('forward-batch-no').value = 'HR-202604001';
      }
      traceForward();
    }
    
    // 点击同组零部件进行追溯
    function traceSiblingMaterial(code) {
      document.getElementById('forward-part-no').value = code;
      document.getElementById('forward-batch-no').value = code;
      traceForward();
    }
    
    // 设置逆向追溯演示数据
    function setReverseDemo() {
      document.getElementById('reverse-sn').value = 'CR6-20260428-001';
      traceReverse();
    }
    
    // 正向追溯查询
    function traceForward() {
      const partNo = document.getElementById('forward-part-no').value.trim();
      const batchNo = document.getElementById('forward-batch-no').value.trim();
      
      if (!partNo && !batchNo) {
        alert('请输入零件号或批次号');
        return;
      }
      
      // 优先使用零件号，如果没有则使用批次号
      const searchValue = partNo || batchNo;
      
      // 根据输入的零部件号匹配数据
      if (searchValue.includes('SM')) {
        d = JSON.parse(JSON.stringify(MOCK.forward));
      } else if (searchValue.includes('HR')) {
        d = JSON.parse(JSON.stringify(MOCK.forwardReducer));
      } else {
        d = JSON.parse(JSON.stringify(MOCK.forward)); // 默认显示伺服电机
      }
      
      initTree();
      renderImpactAnalysis(d);
      
      document.getElementById('detailBody').innerHTML = `
        <div class="empty-state">
          <i class="bi bi-arrow-left-circle"></i>
          <p>请点击左侧追溯树节点查看详情</p>
        </div>`;
    }
    
    // 逆向追溯查询
    function traceReverse() {
      const sn = document.getElementById('reverse-sn').value.trim();
      if (!sn) {
        alert('请输入整机S/N码');
        return;
      }
      
      // 加载逆向追溯数据
      d = JSON.parse(JSON.stringify(MOCK.reverse));
      initTree();
      renderReverseImpactAnalysis(d);
      
      document.getElementById('detailBody').innerHTML = `
        <div class="empty-state">
          <i class="bi bi-arrow-left-circle"></i>
          <p>请点击左侧追溯树节点查看详情</p>
        </div>`;
    }
    
    // 渲染正向追溯影响范围分析
    function renderImpactAnalysis(data) {
      const impactDiv = document.getElementById('impactAnalysis');
      const infoDiv = document.getElementById('impactInfo');
      const statsDiv = document.getElementById('impactStats');
      const alertDiv = document.getElementById('impactAlert');
      
      // 计算统计数据
      const products = data.products || [];
      const shipped = products.filter(p => p.status === '已发货').length;
      const inStock = products.filter(p => p.status === '在库').length;
      const abnormal = products.filter(p => p.fqcConclusion === '不合格' || p.hasMrb).length;
      
      // 设置信息
      infoDiv.innerHTML = `零部件：<strong>${data.materialName || '伺服电机'} / 批次：${data.batchNo}</strong> / 供应商：<strong>${data.supplier.name}</strong>`;
      
      // 设置统计数据
      statsDiv.innerHTML = `
        <div class="impact-stat-item shipped">
          <span class="stat-num">${shipped}</span>
          <span class="stat-text">已发货</span>
        </div>
        <div class="impact-stat-item instock">
          <span class="stat-num">${inStock}</span>
          <span class="stat-text">在库</span>
        </div>
        <div class="impact-stat-item abnormal">
          <span class="stat-num">${abnormal}</span>
          <span class="stat-text">异常</span>
        </div>
        <div class="impact-stat-item">
          <span class="stat-text">共涉及 <strong>1</strong> 张工单 · <strong>${products.length}</strong> 台整机</span>
        </div>
      `;
      
      // 设置异常提醒
      const abnormalProducts = products.filter(p => p.fqcConclusion === '不合格' || p.hasMrb);
      if (abnormalProducts.length > 0) {
        const firstAbnormal = abnormalProducts[0];
        alertDiv.style.display = 'flex';
        alertDiv.innerHTML = `<i class="bi bi-info-circle"></i> 其中 <strong>${abnormalProducts.length}</strong> 个成品存在质量异常：成品 ${firstAbnormal.batchNo} FQC不合格、${firstAbnormal.mrbNo || 'MRB'} 处置中`;
      } else {
        alertDiv.style.display = 'none';
      }
      
      // 显示影响范围分析
      impactDiv.style.display = 'block';
    }
    
    // 渲染逆向追溯影响范围分析
    function renderReverseImpactAnalysis(data) {
      const impactDiv = document.getElementById('impactAnalysis');
      const infoDiv = document.getElementById('impactInfo');
      const statsDiv = document.getElementById('impactStats');
      const alertDiv = document.getElementById('impactAlert');
      
      // 逆向追溯的影响范围分析简化显示
      infoDiv.innerHTML = `整机：<strong>${data.productName} ${data.productSN}</strong> / 客户：<strong>${data.customer}</strong>`;
      
      statsDiv.innerHTML = `
        <div class="impact-stat-item">
          <span class="stat-text">状态：<strong>${data.status}</strong></span>
        </div>
        <div class="impact-stat-item">
          <span class="stat-text">发货日期：<strong>${data.shipDate}</strong></span>
        </div>
        <div class="impact-stat-item">
          <span class="stat-text">装配物料：<strong>${(data.materials || []).length}</strong> 种</span>
        </div>
      `;
      
      alertDiv.style.display = 'none';
      impactDiv.style.display = 'block';
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      initTree();
    });
  </script>
</body>
</html>
